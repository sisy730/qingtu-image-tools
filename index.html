<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻图 · 免费图片压缩与格式转换</title><style>
:root{--ink:#202522;--muted:#738079;--line:#e5ebe7;--green:#176c4b;--pale:#edf6f0;--bg:#f8faf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1120px)/2),24px);background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:21px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-size:18px}.tag{color:var(--muted);font-size:13px}.wrap{max-width:1040px;margin:58px auto;padding:0 24px}.intro{text-align:center;margin-bottom:34px}.eyebrow{display:inline-block;background:var(--pale);color:var(--green);padding:5px 12px;border-radius:99px;font-weight:700;font-size:12px}.intro h1{font-size:38px;line-height:1.2;margin:16px 0 10px;letter-spacing:-1px}.intro p{color:var(--muted);margin:0}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 34px #1b43200a}.drop{height:190px;border:1.5px dashed #b9c9bf;border-radius:16px;background:#fbfdfb;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s}.drop.over{border-color:var(--green);background:var(--pale)}.upicon{width:44px;height:44px;background:#e9f3ed;color:var(--green);border-radius:14px;display:grid;place-items:center;margin:0 auto 11px;font-size:22px}.drop strong{display:block;font-size:16px}.drop small{display:block;color:var(--muted);margin-top:5px}.drop button{border:0;background:var(--green);color:white;border-radius:9px;padding:9px 15px;margin-top:12px;font-weight:700;cursor:pointer}.settings{display:flex;align-items:end;gap:16px;margin:20px 0 8px;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 32px 0 12px;background:#fff;font:inherit;min-width:150px;color:var(--ink)}.quality{flex:1;min-width:210px}.qualityline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.quality input{width:100%;accent-color:var(--green);margin:11px 0}.run{height:42px;padding:0 20px;border:0;border-radius:10px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}.run:disabled{opacity:.45;cursor:default}.privacy{font-size:12px;color:var(--muted);margin-left:auto}.privacy b{color:var(--green)}.files{margin-top:22px;display:grid;gap:10px}.file{display:grid;grid-template-columns:54px 1fr auto;gap:13px;align-items:center;border:1px solid var(--line);padding:11px;border-radius:13px}.thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:#f2f5f3}.fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.meta{font-size:12px;color:var(--muted);margin-top:3px}.status{font-size:12px;color:var(--green);font-weight:700}.download{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 11px;color:var(--green);font-weight:700;cursor:pointer}.remove{border:0;background:none;color:#99a39d;font-size:19px;cursor:pointer;margin-left:6px}.empty{text-align:center;color:#9aa49e;font-size:13px;padding:7px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.feature{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff}.feature b{display:block;margin-bottom:4px}.feature span{font-size:12px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin:34px 0 26px}.hidden{display:none!important}@media(max-width:650px){.wrap{margin:34px auto;padding:0 16px}.intro h1{font-size:30px}.panel{padding:16px}.settings{align-items:stretch}.field,.quality{width:100%}.field select{width:100%}.run{width:100%}.privacy{width:100%;text-align:center}.features{grid-template-columns:1fr}header{padding:0 17px}.tag{font-size:11px}}
</style></head><body><header><div class="brand"><span class="logo">轻</span>轻图</div><div class="tag">免费 · 无需注册 · 本地处理</div></header><main class="wrap"><section class="intro"><span class="eyebrow">简单、快速、安心</span><h1>图片压缩与格式转换</h1><p>几秒钟缩小图片体积，或转换成常用格式。图片在你的设备上处理，不会上传到服务器。</p></section><section class="panel"><div class="drop" id="drop"><div><div class="upicon">↑</div><strong>把图片拖到这里</strong><small>支持 JPG、PNG、WEBP、BMP · 可一次添加多张</small><button type="button" id="pick">选择图片</button><input id="input" type="file" accept="image/*,.bmp" multiple hidden></div></div><div class="settings"><div class="field"><label for="format">转换格式</label><select id="format"><option value="image/webp">WEBP（体积更小）</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div><div class="quality" id="qualitybox"><div class="qualityline"><label for="quality">压缩质量</label><span id="qval">80%</span></div><input id="quality" type="range" min="10" max="100" value="80"></div><button class="run" id="process" disabled>压缩并转换</button><div class="privacy">🔒 <b>文件不离开你的设备</b></div></div><div class="files" id="files"><div class="empty" id="empty">添加图片后，结果会显示在这里</div></div></section><section class="features"><div class="feature"><b>⚡ 即选即用</b><span>无需安装软件，也不用注册账号。</span></div><div class="feature"><b>🔒 隐私优先</b><span>在浏览器本地完成处理，不上传图片。</span></div><div class="feature"><b>📦 批量处理</b><span>一次添加多张，逐张下载转换结果。</span></div></section><footer>轻图 · 一个轻量、免费的图片小工具</footer></main><script>
const input=document.querySelector('#input'),drop=document.querySelector('#drop'),filesBox=document.querySelector('#files'),processBtn=document.querySelector('#process'),fmt=document.querySelector('#format'),quality=document.querySelector('#quality'),qval=document.querySelector('#qval'),qualitybox=document.querySelector('#qualitybox');let items=[];const fmtExt={'image/webp':'webp','image/jpeg':'jpg','image/png':'png'};function size(n){return n<1024*1024?(n/1024).toFixed(1)+' KB':(n/1024/1024).toFixed(2)+' MB'}
document.querySelector('#pick').onclick=()=>input.click();drop.onclick=e=>{if(e.target.tagName!=='BUTTON')input.click()};input.onchange=()=>add(input.files);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>add(e.dataTransfer.files));quality.oninput=()=>qval.textContent=quality.value+'%';fmt.onchange=()=>qualitybox.classList.toggle('hidden',fmt.value==='image/png');function add(list){for(const f of list){if(!f.type.startsWith('image/'))continue;items.push({file:f,url:URL.createObjectURL(f),result:null})}render()}function render(){filesBox.innerHTML='';if(!items.length){filesBox.innerHTML='<div class="empty">添加图片后，结果会显示在这里</div>';processBtn.disabled=true;return}processBtn.disabled=false;items.forEach((it,i)=>{const row=document.createElement('div');row.className='file';const preview=it.result?.url||it.url;row.innerHTML=`<img class="thumb" src="${preview}"><div><div class="fname"></div><div class="meta"></div></div><div>${it.result?'<span class="status">完成 · '+size(it.result.blob.size)+'</span> <button class="download">下载</button>':'<span class="status">待处理 · '+size(it.file.size)+'</span>'}<button class="remove" title="移除">×</button></div>`;row.querySelector('.fname').textContent=it.file.name;row.querySelector('.meta').textContent=it.result?`原图 ${size(it.file.size)} → ${size(it.result.blob.size)}`:it.file.type.replace('image/','').toUpperCase();row.querySelector('.remove').onclick=()=>{if(it.result)URL.revokeObjectURL(it.result.url);URL.revokeObjectURL(it.url);items.splice(i,1);render()};if(it.result)row.querySelector('.download').onclick=()=>{const a=document.createElement('a');a.href=it.result.url;a.download=it.file.name.replace(/\.[^.]+$/,'')+'.'+fmtExt[fmt.value];a.click()};filesBox.append(row)})}
processBtn.onclick=async()=>{processBtn.disabled=true;processBtn.textContent='处理中…';for(const it of items){if(it.result)URL.revokeObjectURL(it.result.url);try{const img=await createImageBitmap(it.file),canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;canvas.getContext('2d').drawImage(img,0,0);const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('当前浏览器不支持该格式')),fmt.value,Number(quality.value)/100));it.result={blob,url:URL.createObjectURL(blob)};img.close()}catch(e){it.result=null}}processBtn.textContent='压缩并转换';render()};
</script></body></html>
